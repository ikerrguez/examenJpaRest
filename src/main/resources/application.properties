spring.application.name=examen-cine

# --- Conexión MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/examen_cine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# "create-drop" borra y recrea las tablas en cada arranque (así data.sql nunca duplica datos)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Carga de data.sql ---
# Hibernate crea primero las tablas y DESPUÉS se ejecuta data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8